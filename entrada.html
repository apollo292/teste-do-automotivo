<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autofix - Login</title>
    <link rel="stylesheet" href="entrada.css">
</head>
<body>
    <h1>Bem-vindo ao *AutoFix*</h1>
    <div id="algo">
        <div id="container">
            <div id="boxLogin">
                <label>Usuário:</label>
                <br>
                <input placeholder="Ex: Nome Sobrenome // nome123@gmail.com" id="inputUsuario">
            </div>
            <br>
            <div id="boxSenha">
                <label>Senha:</label>
                <br>
                <input placeholder="Ex: 12345678" id="inputSenha">
            </div>
        </div>
        <br></br>
        <button id="btnAcesso">Entrar</button>
    </div>
    
    <script src="entrada.js"></script>
</body>
</html>
